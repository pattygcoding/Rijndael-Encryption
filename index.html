<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rijndael Encryption Showcase</title>
    <!-- The canonical address of the published site on its custom domain. -->
    <link rel="canonical" href="https://encryption.pattygcoding.com/" />
    <!-- The favicon is the portfolio's logo, the same file PG-Website serves.  Vite
         copies `public/` to the site root, and src/main.ts pins this path to the
         deployment root so deep routes (`/c/256/overview`) resolve it too. -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="description" content="Rijndael/AES encryption in 11 languages at 128, 192 and 256 bits, all producing byte-for-byte identical output. Browse the source and the verified console output of every implementation." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rijndael Encryption Showcase" />
    <meta property="og:title" content="Rijndael Encryption Showcase" />
    <meta property="og:description" content="Rijndael/AES encryption in 11 languages at 128, 192 and 256 bits, all producing byte-for-byte identical output." />
    <meta property="og:url" content="https://encryption.pattygcoding.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Rijndael Encryption Showcase" />
    <meta name="twitter:description" content="Rijndael/AES encryption in 11 languages at 128, 192 and 256 bits, all producing byte-for-byte identical output." />
    <script>
        // Choose the theme before first paint so there is no flash of the wrong palette.
        // The app only mirrors this attribute afterwards (src/store/theme.ts).
        (function () {
            var stored = null;
            try { stored = localStorage.getItem("re-theme"); } catch (error) { stored = null; }
            var prefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
            document.documentElement.setAttribute("data-theme", stored || (prefersLight ? "light" : "dark"));
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- Both Prism themes are loaded; the unused one is parked behind media="not all". -->
    <link id="prism-dark" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <link id="prism-light" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css" rel="stylesheet" media="not all" />
</head>
<body class="bg-ink-950 text-fg font-sans antialiased">
    <div id="app"></div>

    <!-- The showcase data, generated from the real repository by `npm run data`
         (tools/generate-data.mjs).  A classic script, so it runs before the app
         module below and the app needs no fetch - which is also why the file is a
         plain `window.ENCRYPTION_DATA = { ... }` assignment. -->
    <script src="/encryption-data.js"></script>
    <!-- Prism.js core + autoloader (loads a grammar on demand for any language) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js" data-manual></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
